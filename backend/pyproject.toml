[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tujjar-backend"
version = "0.1.0"
description = "Tujjar AI Marketplace SaaS Backend"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2,<5.2",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-cors-headers>=4.3,<5.0",
    "django-filter>=23.0,<25.0",
    "drf-spectacular>=0.27,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "celery[redis]>=5.4,<6.0",
    "django-celery-beat>=2.6,<3.0",
    "django-celery-results>=2.5,<3.0",
    "Pillow>=10.0,<12.0",
    "django-storages[boto3]>=1.14,<2.0",
    "boto3>=1.34,<2.0",
    "python-decouple>=3.8,<4.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "cryptography>=42.0,<51.0",
    "pgvector>=0.3,<1.0",
    "langchain>=0.2,<1.0",
    "litellm>=1.40,<2.0",
    "django-ratelimit>=4.1,<5.0",
    "pyotp>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "django-stubs>=5.0,<6.0",
    "pytest-django>=4.8,<5.0",
    "pytest-asyncio>=0.23,<1.0",
    "factory-boy>=3.3,<4.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["apps", "config"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501", "B904", "N806", "N815", "A005", "B017", "SIM102", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F405", "E402"]
"apps/templates/data.py" = ["B006"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.coverage.run]
source = ["apps", "config", "tests"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.django-stubs]
django_settings_module = "config.settings.testing"
